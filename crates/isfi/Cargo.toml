[package]
name = "isfi"
version = "0.1.0"
edition = "2021"
description = "Incremental Semantic Filesystem Index (ISFI) for navigating unstructured knowledge"

[dependencies]
async-trait = "0.1"
hex = "0.4.3"
notify = "6.1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
sqlite-vec = "0.1.9"
thiserror = "1.0"
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
zerocopy = "0.8.55"
