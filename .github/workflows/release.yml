name: Release

# Triggers on a version tag push (v0.1.0, v1.2.3, ...) or manually via the
# Actions tab. Each matrix leg builds on its OWN native architecture rather
# than cross-compiling a universal macOS binary — this project's native C/C++
# dependencies (llama.cpp, tesseract, leptonica, aws-lc-sys, all compiled
# from source via cmake in build.rs) are far more likely to succeed built
# natively per-arch than cross-compiled.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14 # Apple Silicon (arm64) — native
          - platform: macos-13 # Intel (x86_64) — native
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # Tauri's own Linux system requirements, plus cmake/libclang for this
      # project's native -sys crates (llama-cpp-sys-2 uses bindgen; several
      # crates here vendor-build their C/C++ sources rather than link a
      # system package, so libssl-dev covers the one system lib actually
      # linked against — cpp-httplib's optional SSL support in llama.cpp).
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential curl wget file libssl-dev libgtk-3-dev \
            cmake libclang-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/workspace/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/workspace
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing/notarization — tauri-action skips signing cleanly
          # if these are unset, so the workflow works unsigned today and
          # starts signing the moment these secrets are added.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/workspace
          tagName: ${{ github.ref_name }}
          releaseName: "Dimi ${{ github.ref_name }}"
          releaseBody: "See the assets below to download for your platform."
          releaseDraft: true
          prerelease: false
