[package]
name = "dimi-runtime"
version = "0.1.0"
edition = "2021"
description = "Dimi kernel, services, connectors and pipelines"

[lib]
name = "dimi_runtime"

[dependencies]
async-trait = "0.1.91"
calamine = "0.36.0"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
dirs = "6.0.0"
encoding_rs = "0.8.35"
fastembed = "5.17.3"
futures-core = "0.3.33"
hf-hub = "1.0.0"
llama-cpp-2 = "0.1.152"
notify = "8.2.0"
isfi = { path = "../crates/isfi" }
pdf-extract = "0.12.0"
quick-xml = "0.41.0"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
sqlite-vec = "0.1.9"
sysinfo = "0.38.4"
tesseract = "0.15.2"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
zerocopy = { version = "0.8.55", features = ["derive"] }
zip = "8.6.0"
genpdf = "0.2.0"
docx-rs = "0.4.22"
